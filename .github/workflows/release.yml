name: Build and Release Packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - 25.12.0
          - 24.10.0

        arch:
          # High-Performance ARM
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic

          # 32-bit ARM
          - arm_cortex-a7_neon-vfpv4
          - arm_cortex-a9_vfpv3-d16
          - arm_cortex-a15_neon-vfpv4

          # MIPS
          - mips_24kc
          - mipsel_24kc

          # x86
          - x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          PACKAGES: darkmoon
          IGNORE_ERRORS: 0

      - name: Collect Packages
        run: |
          mkdir -p dist
          find bin/packages/ -type f \( -name "*darkmoon*.apk" -o -name "*darkmoon*.ipk" \) | while read file; do
            filename=$(basename "$file")
            cp "$file" "dist/${{ matrix.arch }}_${filename}"
          done

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-${{ matrix.arch }}-${{ matrix.version }}
          path: dist/*

      - name: Add to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
